name: CI

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
  pull_request:

jobs:
  ci:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint package
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Smoke test package
        run: npm run pack:smoke

      - name: Start broker stack
        run: docker compose up -d

      - name: Run broker integration suite
        run: npm run test:integration

      - name: Run conformance matrix
        shell: bash
        run: |
          for transport in tcp ws; do
            for auth_mode in anonymous valid_jwt; do
              output="artifacts/conformance-${transport}-${auth_mode}.json"
              CONFORMANCE_TRANSPORT="$transport" \
                CONFORMANCE_AUTH_MODE="$auth_mode" \
                CONFORMANCE_OUTPUT="$output" \
                npm run test:conformance
            done
          done

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitz-ts-conformance-results
          path: artifacts/conformance-*.json
          if-no-files-found: warn

      - name: Tear down broker stack
        if: always()
        run: docker compose down --volumes
