name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint source
        run: npm run lint

      - name: Check public types
        run: npm run typecheck:contract

      - name: Check fixtures
        run: npm run fixture:check

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build source
        run: npm run build

      - name: Run unit tests with coverage
        run: npm exec -- vp test run --project unit --coverage

  node-compat:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build source
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  browser:
    env:
      FITZ_BROKER_IMAGE: ghcr.io/cntryl/fitz:develop@sha256:639832120496ae98309f7f8f947fbf431ea28ef3371cf0f00a70411b0e73e110
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start broker stack
        run: docker compose up -d

      - name: Run Playwright ${{ matrix.browser }} tests
        run: |
          until curl --fail --silent http://127.0.0.1:4290/health; do sleep 1; done
          npx playwright test --project=${{ matrix.browser }}

      - name: Stop broker stack
        if: always()
        run: docker compose down --volumes
