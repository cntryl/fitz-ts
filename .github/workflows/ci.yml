name: CI

on:
  workflow_dispatch:
    inputs:
      broker_tag:
        description: Fitz broker image tag
        type: choice
        options: [main, develop]
        default: main
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  FORCE_COLOR: "1"
  FITZ_BROKER_IMAGE: ghcr.io/cntryl/fitz:${{ inputs.broker_tag || 'main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint source
        run: npm run lint

      - name: Check public types
        run: npm run typecheck:contract

      - name: Check fixtures
        run: npm run fixture:check

      - name: Check upstream fixtures
        if: github.event_name == 'schedule'
        run: npm run fixture:check -- --upstream

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build package
        run: npm run build

      - name: Lint package contents
        run: npm run package:lint

      - name: Smoke test package
        run: npm run pack:smoke

      - name: Run unit tests with coverage
        run: npm exec -- vp test run --project unit --coverage

  node-compat:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Smoke test package
        run: npm run pack:smoke

  broker:
    strategy:
      fail-fast: false
      matrix:
        leg: [integration, tcp-anonymous, tcp-valid_jwt, ws-anonymous, ws-valid_jwt]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FITZ_PATTERNED_LEASE_INVENTORY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start broker stack
        run: docker compose up -d

      - name: Wait for broker
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4290/health && exit 0
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Run integration tests
        if: matrix.leg == 'integration'
        run: time npm run test:integration -- --reporter=verbose

      - name: Run conformance tests
        if: matrix.leg != 'integration'
        env:
          CONFORMANCE_TRANSPORT: ${{ startsWith(matrix.leg, 'tcp-') && 'tcp' || 'ws' }}
          CONFORMANCE_AUTH_MODE: ${{ endsWith(matrix.leg, 'valid_jwt') && 'valid_jwt' || 'anonymous' }}
          CONFORMANCE_OUTPUT: artifacts/conformance-${{ matrix.leg }}.json
        run: time npm run test:conformance

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broker-${{ matrix.leg }}
          path: artifacts/conformance-*.json
          if-no-files-found: ignore

      - name: Save logs and stop broker stack
        if: always()
        run: mkdir -p artifacts && docker compose logs > artifacts/broker-${{ matrix.leg }}.log && docker compose down --volumes

  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start broker stack
        run: docker compose up -d

      - name: Run Playwright ${{ matrix.browser }} tests
        run: |
          until curl --fail --silent http://127.0.0.1:4290/health; do sleep 1; done
          npx playwright test --project=${{ matrix.browser }}

      - name: Stop broker stack
        if: always()
        run: docker compose down --volumes

  package:
    needs: [quality, node-compat, broker, browser]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Pack npm tarball
        id: pack
        run: |
          mkdir release
          npm pack --pack-destination release
          echo "path=$(find release -name '*.tgz')" >> "$GITHUB_OUTPUT"

      - name: Attest npm tarball
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pack.outputs.path }}

      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball-${{ github.sha }}
          path: release/*.tgz
          if-no-files-found: error

  verdict:
    if: always()
    needs: [quality, node-compat, broker, browser, package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test '${{ needs.quality.result }}' = success
          test '${{ needs.node-compat.result }}' = success
          test '${{ needs.broker.result }}' = success
          test '${{ needs.browser.result }}' = success
          test '${{ needs.package.result }}' = success -o '${{ needs.package.result }}' = skipped
